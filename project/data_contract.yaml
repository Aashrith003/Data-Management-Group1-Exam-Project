slaProperties:
- property: frequency
  value: manual
  description: Manual snapshot refresh; no scheduled updates.
- property: retention
  value: project duration
  description: Kept for the course project; raw snapshots retained unchanged with SHA-256 hashes.
authoritativeDefinitions:
- type: source
  url: https://data-seattlecitygis.opendata.arcgis.com/datasets/SeattleCityGIS::sdot-collisions-all-years
  description: SDOT Collisions All Years (no licence displayed)
- type: source
  url: https://data.seattle.gov/dataset/Seattle-Streets/w3hh-bqt5
  description: Seattle Streets (no licence; no-warranty disclaimer)
- type: source
  url: https://data.seattle.gov/Transportation/Traffic-Counts-by-Study/xucb-vzhc
  description: Traffic Counts by Study (Public Domain)
customProperties:
- property: sourceOwner
  value: City of Seattle / Seattle Department of Transportation
- property: snapshotPeriod
  value: 2019-01-01/2025-12-31
- property: snapshotDownloaded
  value: '2026-11-02'
- property: inputSha256
  value:
    crashes: 09d404a0f8562c1fc30a198eff9eb7b10f30771a38628305413623c178d9f2b3
    streets: a1627928ca669a51fbab5f139b7c9503af1815b56e130c03d8cb463d95c2ec59
    traffic: e7e95191d04d6454755e3732698717566d466dcc8c025b0f0ddc9595021c97ad
- property: classification
  value: public open data; source terms apply; no licence assigned to the derived package
- property: approvalStatus
  value: approved by Group 1 on 2026-11-07
  description: 'Approved by the group; derived data owner: Nagothi Ram Dileep.'
- property: stopRules
  value:
  - missing_required_columns
  - duplicate_or_invalid_primary_keys
  - negative_or_non_numeric_injury_counts
  - duplicate_group_grain
